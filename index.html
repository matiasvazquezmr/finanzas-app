<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mis Finanzas</title>
    
    <link rel="manifest" href="manifest.json">
    <!-- CORRECCIÓN: Etiqueta meta arreglada -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090d16">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-100 antialiased bg-[#090d16]">

    <div class="w-full max-w-md mx-auto h-[100dvh] sm:h-[95vh] sm:my-[2.5vh] sm:rounded-[2rem] bg-[#090d16] flex flex-col relative overflow-hidden shadow-2xl sm:border sm:border-slate-800/80">

        <header class="glass-panel px-4 py-3.5 pt-12 sm:pt-3.5 text-center relative z-20 shrink-0 border-b border-white/[0.07]">
            <h1 class="text-sm font-semibold tracking-tight text-slate-200 relative z-10 flex items-center justify-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
                Mis Finanzas
            </h1>
        </header>

        <div id="initial-loader" class="absolute inset-0 bg-[#090d16]/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
            <svg class="animate-spin h-8 w-8 text-emerald-400 mb-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-slate-400 font-semibold text-xs tracking-wide">Sincronizando...</p>
        </div>

        <div id="scroll-area" class="flex-1 overflow-x-hidden overflow-y-auto no-scrollbar relative pb-24 z-10">
            <div id="view-home" class="tab-content active p-4"></div>
            <div id="view-dash" class="tab-content p-4"></div>
            <div id="view-history" class="tab-content p-4"></div>
        </div>

        <nav class="glass-panel absolute bottom-0 w-full flex justify-around p-1.5 pb-8 sm:pb-3 z-30 border-t border-white/[0.07]">
            <button data-tab="view-home" class="nav-btn active flex flex-col items-center justify-center text-slate-400 w-1/3 py-1.5 transition-all">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"></path></svg>
                <span class="text-[9px] font-semibold tracking-wide">Cargar</span>
            </button>
            <button data-tab="view-dash" class="nav-btn flex flex-col items-center justify-center text-slate-400 w-1/3 py-1.5 transition-all">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                <span class="text-[9px] font-semibold tracking-wide">Dashboard</span>
            </button>
            <button data-tab="view-history" class="nav-btn flex flex-col items-center justify-center text-slate-400 w-1/3 py-1.5 transition-all">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span class="text-[9px] font-semibold tracking-wide">Historial</span>
            </button>
        </nav>

        <div id="toast" class="glass-panel absolute top-4 left-1/2 transform -translate-x-1/2 text-white px-4 py-2 rounded-full shadow-xl opacity-0 pointer-events-none z-50 font-medium text-xs flex items-center gap-1.5 w-max border border-slate-700/60">
            <span class="text-emerald-400 text-sm">✓</span> Registro guardado
        </div>

    </div>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
